- date: '2026-04-13'
  speakers:
  - tomas_gonzalez
  title: Theoretical guarantees for Private Evolution
  abstract: >-
    Private Evolution (PE) is a training-free method for differentially private synthetic data generation
    that has shown strong empirical performance, but until recently lacked theoretical guarantees.
    In this talk, I will present the main result of Private Evolution Converges (https://arxiv.org/pdf/2506.08312),
    which proves that PE can generate an (ε,δ)-differentially private synthetic dataset with expected
    1-Wasserstein distance of order (d/(nε))^(1/d) to the sensitive data. This gives the first convergence
    guarantee for PE and places this practical method on a firmer theoretical foundation. I will also
    discuss extensions of this paper that I'm currently working on.
  sources:
  - sheet
