- date: '2026-03-30'
  speakers:
  - ziqi_liu
  title: A Causal Perspective on Shapley Value and Probabilistic Value Estimation
  abstract: >-
    Shapley values and probabilistic values provide principled ways to assign credit in problems such
    as data valuation, but their estimation is challenging because the underlying utility function
    is defined on all (2^n) subsets of (n) items. In this talk, I will describe a causal perspective
    on this problem. The key idea is to treat the subset-indexed utility (u(S)) as a multi-treatment
    response surface and to view the target value as a linear functional of that surface. For a fixed
    player, this leads to a weighted average of marginal treatment effects; for the full value vector,
    it leads to questions of design, sample reuse, and efficient correction. Using this viewpoint,
    I will revisit several lines of work in the Shapley literature and connect them to familiar ideas
    from causal inference, including matched or paired designs, inverse-probability weighting, regression
    adjustment, and doubly robust style estimators. I will focus on how these methods trade off variance
    reduction, sample reuse, and structural modeling of the utility function, and on why this perspective
    may be useful for understanding recent advances in semivalue estimation.
