  title: Advances in selective inference
  abstract: >-
    During this talk, I will briefly discuss some modern methods for ensuring valid inference after
    model selection including: data splitting, data fission, simultanaeous inference, and conditional
    selective inference. I will then discuss some recent work that comment on the relative efficiency
    of each of these frameworks. Recent papers: Infer-and-widen, or not? (https://arxiv.org/abs/2408.06323)
    On Selecting and Conditioning in Multiple Testing and Selective Inference (https://arxiv.org/abs/2207.13480)
    Background papers: https://arxiv.org/abs/2112.11079 https://arxiv.org/abs/1611.05401 https://arxiv.org/abs/1306.1059
    https://arxiv.org/abs/1311.6238
