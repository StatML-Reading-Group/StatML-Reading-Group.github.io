- date: '2025-10-29'
  speakers:
  - burak_varici
  title: Score-based Causal Representation Learning
  abstract: >-
    Representation learning has shown great success at learning low-dimensional, empirically useful
    representations of high-dimensional data in an unsupervised manner. Despite this success, standard
    approaches are limited to association-level insights and are inadequate for strong generalization.
    As a key step toward more principled representation learning, causal representation learning (CRL)
    has emerged as a cutting-edge field that merges the strengths of statistical inference, machine
    learning, and causal inference. Its objective is to estimate the ground truth, identifiable latent
    representations and rich structures that model the interactions among the variables in the latent
    space. In this talk, we will mainly show how to learn causal representations from unstructured,
    high-dimensional data observed under multiple (interventional) environments. To that end, we establish
    connections between score functions and CRL. First, we address CRL in the nonparametric setting
    under relatively rich interventional information. Then, we consider a linear transformation from
    latent to observed variables, discussing crucial aspects for algorithm design including intervention
    types (perfect vs. imperfect), intervention size (single vs. multi-node), and sample complexity
    guarantees. https://www.jmlr.org/papers/volume26/24-0194/24-0194.pdf
