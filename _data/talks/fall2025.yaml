- date: '2025-09-24'
  speakers:
  - selina
  title: Conformal PID Control for Time Series Prediction
  abstract: >-
    The paper studies the problem of uncertainty quantification for time series prediction, with the
    goal of providing easy-to-use algorithms with formal guarantees. The algorithms we present build
    upon ideas from conformal prediction and control theory, are able to prospectively model conformal
    scores in an online setting, and adapt to the presence of systematic errors due to seasonality,
    trends, and general distribution shifts. This theory both simplifies and strengthens existing
    analyses in online conformal prediction.
