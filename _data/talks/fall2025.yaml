- date: '2025-09-03'
  speakers:
  - sanjit_dandapanthula
  title: Gromov-Wasserstein geometry of Gaussian measures
  abstract: >-
    We give a gentle introduction to optimal transport theory and Gromov-Wasserstein distances, as
    well as some of their statistical applications. At the end, we discuss some of our recent progress
    in this area, described below. The Gromov-Wasserstein distance with inner product cost (IGW distance)
    quantifies the discrepancy between Borel probability measures on (possibly different) Euclidean
    spaces which have finite second moment. The IGW distance provides a natural framework for comparing
    the shapes of heterogeneous datasets, although its exact computation is generally NP-hard. Previous
    work has studied the metric geometry arising from the IGW distance, but it is generally statistically
    and computationally difficult to estimate the IGW distance and barycenter from samples. In this
    work, we rewrite the IGW distance between uncentered Gaussian measures on separable Hilbert spaces
    as the solution of a quadratic optimization problem on the Stiefel manifold, which we solve numerically
    in simulations. Moreover, we prove upper and lower bounds on the IGW distance between Gaussians
    (up to a Cauchy-Schwarz gap), and for centered Gaussians, we recover a natural closed-form expression
    for the IGW distance and barycenter. Furthermore, we analytically resolve the multi-marginal IGW
    problem between Gaussians. As an extension, we rewrite the multi-marginal optimal transport problem
    between Gaussians as the optimal value of a semidefinite program and solve it efficiently using
    a rank-deficiency constraint. Finally, we apply our results to synthetic experiments, including
    clustering heterogeneous user profiles. Collaborators: Sasha Podkopaev, Shiva Kasiviswanathan,
    Aaditya Ramdas, and Ziv Goldfeld
