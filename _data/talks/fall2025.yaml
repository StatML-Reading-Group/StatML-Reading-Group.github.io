- date: '2025-11-05'
  speakers:
  - nihar_shah
  title: Research funding via lotteries
  abstract: >-
    We will consider decision-making processes that involve evaluating and then selecting items (e.g.,
    scientific peer review, hiring, admissions). Traditionally, the eventual selection is performed
    by first obtaining expert evaluations, followed by rules or deliberations, and eventually deterministically
    selecting a subset of applications. More recently, citing drawbacks of the traditional approach,
    a number of funding agencies worldwide have moved towards a different decision model. These agencies
    have incorporated “partial lotteries” into their decision-making: the review process remains similar
    to that of the traditional process (sometimes omitting deliberations), but the final decisions
    introduce a randomized component that still respects experts’ evaluations. We will first identify
    several problems in current implementations of such partial lotteries. We will then present a
    principled approach to designing improved partial lotteries with strong theoretical guarantees
    and empirical performance. Based on joint work with Alexander Goldberg and Giulia Fanti. Blog
    post: https://researchonresearch.blog/2025/07/12/randomizing-selection-under-uncertainty-designing-principled-partial-lotteries-for-grant-funding-and-beyond/
  sources:
  - sheet
- date: '2025-11-12'
  speakers:
  - rebecca_farina
  title: Automatic Debiased Machine Learning
  abstract: >-
    We will discuss the foundational ideas behind Automatic Debiased Machine Learning (AutoDML), a
    framework to costruct of efficient estimators for causal and semiparametric parameters. Standard
    machine learning methods often yield biased estimates of causal quantities in high-dimensional
    settings, while traditional debiasing techniques rely on the Efficient Influence Function (EIF),
    which can be challenging to derive and may involve unstable components such as inverse probability
    weights. AutoDML provides a principled alternative: it builds double-robust, root-n consistent
    estimators without requiring an explicit EIF expression. Instead, it leverages the Riesz representation
    theorem to directly learn the EIF’s key component by minimizing a Riesz loss function, offering
    an “automatic” and stable approach to debiased estimation that unifies ideas from semiparametric
    theory and modern machine learning.
