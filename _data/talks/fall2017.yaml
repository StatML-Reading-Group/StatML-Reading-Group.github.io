- date: '2017-09-19'
  speakers:
  - yining_wang
  title: Locating the minimum of a function from adaptive queries
  abstract: >-
    I will discuss the question of locating the minimum of an unknown function from noisy adaptive
    queries. I will discuss why the problem does not make much sense for general non-parametric families
    like Holder classes, and why the problem becomes interesting with certain shape constraints such
    as convexity. I will review some results in both the machine learning and the statistics literature
    on convex regression and zeroth order optimization, and mention open questions.
  time: 3pm
