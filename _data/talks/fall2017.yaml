  speakers:
  - todd_kuffner
  title: Philosophy of Science, Principled Statistical Inference, and Data Science
  abstract: >-
    Statistical reasoning and statistical inference have strong historical connections with philosophy
    of science. In this talk, the new paradigm of data-driven science is examined through comparison
    with principled statistical approaches. I will review the merits and shortcomings of principled
    statistical inference. The talk will feature a case study of post-selection inference, recent
    progress regarding inference for black box algorithms, and a survey of future challenges.
