- date: '2024-09-17'
  speakers:
  - james_leiner
  title: Demystifying Inference after Adaptive Experiments
  abstract: >-
    Adaptive experiments such as multi-arm bandits adapt the treatment-allocation policy and/or the
    decision to stop the experiment to the data observed so far. This has the potential to improve
    outcomes for study participants within the experiment, to improve the chance of identifying best
    treatments after the experiment, and to avoid wasting data. Seen as an experiment (rather than
    just a continually optimizing system) it is still desirable to draw statistical inferences with
    frequentist guarantees. The concentration inequalities and union bounds that generally underlie
    adaptive experimentation algorithms can yield overly conservative inferences, but at the same
    time the asymptotic normality we would usually appeal to in non-adaptive settings can be imperiled
    by adaptivity. In this article we aim to explain why, how, and when adaptivity is in fact an issue
    for inference and, when it is, understand the various ways to fix it: reweighting to stabilize
    variances and recover asymptotic normality, always-valid inference based on joint normality of
    an asymptotic limiting sequence, and characterizing and inverting the non-normal distributions
    induced by adaptivity.
  time: 3:30-4:30 pm
  room: GHC 6501
