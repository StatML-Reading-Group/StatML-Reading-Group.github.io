- date: '2024-09-24'
  speakers:
  - selina_carter
  title: Online Bootstrap Confidence Intervals for the Stochastic Gradient Descent Estimator
  abstract: >-
    Motivated by work with Jeff Schneider (Robotics Insitute), I will first give a basic intro to
    bootstrapping -- can it be done anytime anywhere? What's the use? Then, I'll discuss the paper
    by Yixin Fang, Jinfeng Xu, Lei Yang (https://arxiv.org/abs/2306.02205): In many applications involving
    large dataset or online learning, stochastic gradient descent (SGD) is a scalable algorithm to
    compute parameter estimates and has gained increasing popularity due to its numerical convenience
    and memory efficiency. While the asymptotic properties of SGD-based estimators have been well
    established, statistical inference such as interval estimation remains much unexplored. The classical
    bootstrap is not directly applicable if the data are not stored in memory. The plug-in method
    is not applicable when there is no explicit formula for the covariance matrix of the estimator.
    In this paper, we propose an online bootstrap procedure for the estimation of confidence intervals,
    which, upon the arrival of each observation, updates the SGD estimate as well as a number of randomly
    perturbed SGD estimates. The proposed method is easy to implement in practice. We establish its
    theoretical properties for a general class of models that includes linear regressions, generalized
    linear models, M-estimators and quantile regressions as special cases. The finite-sample performance
    and numerical utility is evaluated by simulation studies and real data applications.
  time: 3:30-4:30 pm
  room: GHC 6501
