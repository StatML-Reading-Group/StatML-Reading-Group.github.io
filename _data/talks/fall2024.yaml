  title: An introduction to the approximate message passing algorithm
  abstract: >-
    Approximate message passing is a powerful machinery that has found a wide array of applications
    in areas like high dimensional statistics, signal processing, machine learning, etc. We will give
    a gentle introduction to this topic starting with some motivation in statistical estimation, followed
    by some basic analysis of the algorithm. We will also briefly review some recent progress in the
    literature and discuss some potential future problems of the topic.
