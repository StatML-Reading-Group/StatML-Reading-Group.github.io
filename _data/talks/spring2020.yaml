- date: '2020-01-21'
  speakers:
  - purvasha_chakravarti
  title: Model-Independent Detection of New Physics Signals Using Semi-Supervised Classifier Tests.
  abstract: >-
    Abstract: In high energy physics, an important problem is to detect if there is any significant
    difference between the distribution of just background events (generated from an assumed Monte
    Carlo model) and the distribution of the actual observations, which could be a mixture of background
    and signal events. We propose a test based on the performance of a classifier in differentiating
    between the two distributions. <p> </p>
