- date: '2020-02-04'
  speakers:
  - beomjo_park
  title: The Asymptotic Distribution of the MLE in High-dimensional Logistic Models
  abstract: >-
    The asymptotic distribution of the MLE in logistic models based on the classical ML theory does
    not account for the bias and variance inflation, thus yields the incorrect inference if one uses
    LRT. Sur and Candes <a href="https://www.pnas.org/content/116/29/14516">[SC19]</a> proposed a
    theory to handle this issue in the high dimensional setting. Recently, the redux <a href="https://arxiv.org/abs/2001.09351">[ZSC20]</a>
    came out to resolve the arbitrary (Gaussian) feature covariance. I'll more focus on the recent
    paper based on the stochastic representation but will also try to cover the overlapping ideas
    that arise in both papers. <p> </p>
  time: 3pm
