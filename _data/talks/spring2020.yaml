- date: '2020-01-14'
  speakers:
  - larry_wasserman
  title: Universal inference using the split likelihood ratio test
  abstract: >-
    We propose a general method for constructing hypothesis tests and confidence sets that have finite
    sample guarantees without regularity conditions. We refer to such procedures as “universal.” The
    method is very simple and is based on a modified version of the usual likelihood ratio statistic,
    that we call “the split likelihood ratio test” (split LRT). The method is especially appealing
    for irregular statistical models. Canonical examples include mixture models and models that arise
    in shape-constrained inference. Constructing tests and confidence sets for such models is notoriously
    difficult. Typical inference methods, like the likelihood ratio test, are not useful in these
    cases because they have intractable limiting distributions. In contrast, the method we suggest
    works for any parametric model and also for some nonparametric models. Examples of problems for
    which valid tests were not known before our work: (a) testing for number of components in a mixture
    model, (b) testing for whether a density is log-concave, (c) testing for whether a distribution
    is totally positive, (d) testing number of hidden states in an HMM, (e) testing sparsity level
    in a high-dimensional linear model. The split LRT can also be used with profile likelihoods to
    deal with nuisance parameters, and it can also be run sequentially to yield anytime-valid p-values
    and confidence sequences. <p> Reference: Larry Wasserman, Aaditya Ramdas, Sivaraman Balakrishnan,
    2019 (https://arxiv.org/abs/1912.11436) </p>
  time: 3pm
  room: GHC 6501
