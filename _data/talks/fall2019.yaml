- date: '2019-11-12'
  speakers:
  - boyan_duan
  title: Safe testing
  abstract: >-
    There is growing concern in various medical and life sciences that many of the published results
    are irreproducible in the sense that the promised error control guarantees for such results might
    be violated. To alleviate such reproducibility crisis, a class methods called "safe testing" has
    been proposed recently to control Type-1 error for a (potentially infinite) number of tests. Such
    methods construct a (super)martingale to combine evidence from each test, but as opposed to measuring
    the evidence via a p-value as is usually done, safe tests use an "S-value". Unlike the p-value,
    which is designed to control Type-1 error for a single test, the S-value is designed to control
    Type-1 error for an (infinite) sequence of tests. As with p-values, there can be various designs
    of S-values for a given test, however for the parametric tests, there is an "optimal" S-value,
    which takes the form of a Bayes factor with non-standard priors. Bayes factors are known to control
    Type-1 error for an online experiment, but the error guarantee is only proved for a simple null
    whereas the S-value works for composite nulls. As an example, I will present the S-value for the
    t-test, which has better performance in terms of statistical power compared with Jeffreys' Bayesian
    t-test. If time permits, I will also discuss a special case where the S-value itself is a (super)martingale
    which allows for Type-1 error control without combining the S-values. <p> Reference: https://arxiv.org/abs/1906.07801
    </p>
  time: 3pm
  room: GHC 8102
  legacy_urls:
  - /blog/2019/11/12/boyan.html
  sources:
  - blog_index
  - blog_page
- date: '2019-11-19'
  speakers:
  - aaditya_ramdas
  title: Anytime-valid inference
  abstract: >-
    In a wide variety of applications in science and technology, data arrives sequentially (think
    one subject at a time in a psychology study, or one user at a time on a website) and the data
    is often frequently monitored to estimate certain quantities of interest or test hypotheses about
    them. Unfortunately, p-values and confidence intervals developed in the batch setting (to be constructed
    once when the number of data points is specified in advance) are incorrect and invalid when they
    are constructed and peeked at repeatedly. The sub-field of anytime-valid inference tries to construct
    p-values or confidence intervals that are valid simultaneously at all times, including data-dependent
    stopping times. I will give examples of such constructions for various functionals of distributions,
    like means and quantiles, that are valid under nonparametric conditions and are optimal in certain
    senses. The main theoretical quantities of interest are some very interesting nonnegative (super)martingales.
    There are a host of fascinating open research questions surrounding adaptivity to parametric assumptions
    or “simpler” distributions, efficiency relative to an oracle fixed-sample batch method, and expanding
    the types of functionals for which we can construct tight (including constants) and practical
    intervals or p-values that are not too conservative. I’ll try to cover a bit of everything: applications,
    theory, methods, software. This topic forms one central aspect of the SAVI workshop next summer
    http://stat.cmu.edu/~aramdas/SAVI/savi20.html. <p> References: Main publications along this theme
    are: 1. Sequential estimation of quantiles with applications to A/B-testing and best-arm identification
    (S. Howard, A. Ramdas); 2. Uniform, nonparametric, nonasymptotic confidence sequences (S. Howard,
    A. Ramdas, J. Sekhon, J. McAuliffe); 3. Exponential line-crossing inequalities (S. Howard, A.
    Ramdas, J. Sekhon, J. McAuliffe) </p>
  time: 3pm
  room: GHC 8102
