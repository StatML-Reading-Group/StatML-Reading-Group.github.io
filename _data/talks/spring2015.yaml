- date: '2015-03-26'
  speakers:
  - nicolas_garcia_trillos
  title: Distribution Free-transportation Based Two Sample Test.
  abstract: >-
    Following the talks that Aaditya gave during the fall and spring, in this talk I will revisit
    the two sample test problem. In fact, my goal is to present a two sample test with the following
    properties: - It is transportation based in the sense that the quantity to be computed to construct
    the test is the Wasserstein distance between two measures. -It is distribution free, in the sense
    that under the null hypothesis, the asymptotic distribution of the quantity used to construct
    the test does not depend on the distribution the random points were drawn from. I will present
    results and give a sketch of their proofs. This is a joint work with Aaditya Ramdas and Marco
    Cuturi.
