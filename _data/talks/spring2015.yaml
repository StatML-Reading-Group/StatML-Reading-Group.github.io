- date: '2015-02-26'
  speakers:
  - ryan_tibshirani
  title: 'Google PGH Meeting: A General Framework for Fast Stagewise Algorithms'
  abstract: >-
    Forward stagewise regression follows a very simple strategy for constructing a sequence of sparse
    regression estimates: it starts with all coefficients equal to zero, and iteratively updates the
    coefficient (by a small amount ε) of the variable that achieves the maximal absolute inner product
    with the current residual. This procedure has an interesting connection to the lasso: under some
    conditions, it can be shown that the sequence of forward stagewise estimates exactly coincides
    with the lasso path, as the step size ε goes to zero. Furthermore, essentially the same equivalence
    holds outside of least squares regression, with the minimization of a differentiable convex loss
    function subject to an l1 norm constraint (the stagewise algorithm now updates the coefficient
    corresponding to the maximal absolute component of the gradient).<br/> Even when they do not match
    their l1-constrained analogues, stagewise estimates provide a useful approximation, and are computationally
    appealing. Their success in sparse modeling motivates the question: can a simple, effective strategy
    like forward stagewise be applied more broadly in other regularization settings, beyond the l1
    norm and sparsity? The current talk shares an attempt to do just this. I present a general framework
    for stagewise estimation, which yields fast algorithms for problems such as group-structured learning,
    matrix completion, image denoising, and more. <br/> This talk will be based on: <a href="http://www.stat.cmu.edu/~ryantibs/papers/stagewise.pdf">http://www.stat.cmu.edu/~ryantibs/papers/stagewise.pdf</a>
