  title: Active statistical inference
  abstract: >-
    Why do passive inference when you can do active inference?! I'll discuss a recent framework for
    active statistical inference proposed by Zrnic and Candes, which leverages predictions by a black-box
    model to help decide which observations should be labelled. If time allows, I'll relate this work
    to prediction-powered inference. Main paper: https://arxiv.org/pdf/2403.03208.pdf.
