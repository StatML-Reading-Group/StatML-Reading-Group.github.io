- date: '2023-11-16'
  speakers:
  - woonyoung_chang
  title: 'Inference for Projection Parameters in Linear Regression: beyond d=o(n^{1/2})'
  abstract: >-
    We consider the problem of inference for projection parameters in linear regression with increasing
    dimensions. This problem has been studied under a variety of assumptions in the literature. The
    classical asymptotic normality result for the least squares estimator of the projection parameter
    only holds when the dimension $d$ of the covariates is of smaller order than $n^{1/2}$, where
    $n$ is the sample size. Traditional sandwich estimator-based Wald intervals are asymptotically
    valid in this regime. In this work, we propose a bias correction for the least squares estimator
    and prove the asymptotic normality of the resulting debiased estimator as long as $d = o(n^{2/3})$,
    with an explicit bound on the rate of convergence to normality. We leverage recent methods of
    statistical inference that do not require an estimator of the variance to perform asymptotically
    valid statistical inference. https://arxiv.org/abs/2007.09751 https://arxiv.org/abs/2307.00795
  time: 3:30-5:00 pm
  room: GHC 8110
