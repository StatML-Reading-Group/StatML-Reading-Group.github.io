- date: '2023-09-14'
  speakers:
  - ian_waudby_smith
  title: Principal-agent hypothesis testing
  abstract: >-
    Consider the relationship between a regulator (the principal) and a pharmaceutical company (the
    agent). The pharmaceutical company wishes to sell a drug for profit, whereas the regulator wishes
    to allow only efficacious drugs to be marketed. The efficacy of the drug is not known to the regulator,
    so the pharmaceutical company must run a costly trial to prove efficacy to the regulator. Critically,
    the statistical protocol used to establish efficacy affects the behavior of a strategic, self-interested
    pharmaceutical company; a lower standard of statistical evidence incentivizes the pharmaceutical
    company to run more trials for drugs that are less likely to be effective, since the drug may
    pass the trial by chance, resulting in large profits. The interaction between the statistical
    protocol and the incentives of the pharmaceutical company is crucial for understanding this system
    and designing protocols with high social utility. In this work, we discuss how the principal and
    agent can enter into a contract with payoffs based on statistical evidence. When there is stronger
    evidence for the quality of the product, the principal allows the agent to make a larger profit.
    We show how to design contracts that are robust to an agent’s strategic actions, and derive the
    optimal contract in the presence of strategic behavior.
  time: 3:30-5:00 pm
  room: GHC 8103
