- date: '2023-10-12'
  speakers:
  - siddhaarth_sarkar
  title: 'Post-selection Inference for Conformal Prediction: Trading off Coverage for Precision'
  abstract: >-
    Conformal inference has played a pivotal role in providing uncertainty quantification for black-box
    ML prediction algorithms with finite sample guarantees. Traditionally, conformal prediction inference
    requires a data-independent specification of miscoverage level. In practical applications, one
    might want to update the miscoverage level after computing the prediction set. For example, in
    the context of binary classification, the analyst might start with a 95% prediction sets and see
    that most prediction sets contain all outcome classes. Prediction sets with both classes being
    undesirable, the analyst might desire to consider, say 80% prediction set. Construction of prediction
    sets that guarantee coverage with data-dependent miscoverage level can be considered as a post-selection
    inference problem. In this work, we develop simultaneous conformal inference to account for data-dependent
    miscoverage levels. Under the assumption of independent and identically distributed observations,
    our proposed methods have a finite sample simultaneous guarantee over all miscoverage levels.
    This allows practitioners to trade freely coverage probability for the quality of the prediction
    set by any criterion of their choice (say size of prediction set) while maintaining the finite
    sample guarantees similar to traditional conformal inference. I shall explain the background topics
    briefly (conformal inference and confidence bands for CDF) and arrive at the proposed method.
    [1] https://arxiv.org/abs/2304.06158
  time: 3:30-5:00 pm
  room: GHC 8106
