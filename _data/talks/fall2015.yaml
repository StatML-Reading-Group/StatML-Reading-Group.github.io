- date: '2015-09-09'
  speakers:
  - ryan_tibshirani
  title: Random projection ensemble classification by Cannings and Samworth
  abstract: >-
    We introduce a very general method for high-dimensional classification, based on careful combination
    of the results of applying an arbitrary base classifier to random projections of the feature vectors
    into a lower-dimensional space. In one special case that we study in detail, the random projections
    are divided into non-overlapping blocks, and within each block we select the projection yielding
    the smallest estimate of the test error. Our random projection ensemble classifier then aggregates
    the results of applying the base classifier on the selected projections, with a data-driven voting
    threshold to determine the final assignment. Our theoretical results elucidate the effect on performance
    of increasing the number of projections. Moreover, under a boundary condition implied by the sufficient
    dimension reduction assumption, we show that the test excess risk of the random projection ensemble
    classifier can be controlled by terms that do not depend on the original data dimension. The classifier
    is also compared empirically with several other popular high-dimensional classifiers via an extensive
    simulation study, which reveals its excellent finite-sample performance.<br/> <a href="http://arxiv.org/pdf/1506.03486v1.pdf">http://arxiv.org/pdf/1506.03486v1.pdf</a>
  time: 1:30 pm
