  speakers:
  - yen_chi_chen
  title: Asymptotic Theory for Density Ridges
  abstract: >-
    Density ridges are curve-like structures characterizing high density regions. In cosmology, density
    ridges are excellent models for tracing structures of the Universe. We study asymptotic theory
    for density ridges and propose a procedure for constructing confidence sets using the bootstrap.
    Moreover, we generalize the integrated distance to assess the risk for estimating ridges, and
    choose smooth bandwidth via minimizing the risk. <br/><br/> References: <br/> <a href="http://arxiv.org/abs/1406.5663">
    Yen-Chi Chen, Christopher Genovese, Larry Wasserman. "Asymptotic theory for density ridges", 2014
    </a> <br/> <a href="http://arxiv.org/abs/1506.02278"> Yen-Chi Chen, Christopher Genovese, Shirley
    Ho, Larry Wasserman. "Optimal Ridge Detection using Coverage Risk", 2015 </a> <br/>
