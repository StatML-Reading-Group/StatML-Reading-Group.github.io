- date: '2015-10-21'
  speakers:
  - jacob_bien
  title: Graph-Guided Banding for Covariance Estimation
  abstract: >-
    Reliable estimation of the covariance matrix is notoriously difficult in high dimensions. Numerous
    methods assume that the population covariance (or inverse covariance) matrix is sparse while making
    no particular structural assumptions on the desired sparsity pattern. A highly-related, yet complementary,
    literature studies the setting in which the measured variables have a known ordering, in which
    case a banded (or near-banded) population matrix is assumed. This work focuses on the broad middle
    ground that lies between the former approach of complete neutrality to the sparsity pattern and
    the latter highly restrictive assumption of having a known ordering. We develop a class of convex
    regularizers that is in the spirit of banding and yet attains sparsity structures that can be
    customized to a wide variety of applications. <br/>
