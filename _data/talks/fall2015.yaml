- date: '2015-10-14'
  speakers:
  - alessandro_rinaldo
  title: Random Networks, Exchangeability and Graphical Models
  abstract: >-
    We describe several connections between exchangeable random networks and graphical models. We
    show that exchangeable finite networks extendable to larger networks can be approximated by mixtures
    of curved exponential families. In turn, these models correspond to a distinguished class of graphical
    models of marginal independence for binary data. We further consider extendability to infinite
    exchangeable networks. We obtain a simple derivation of de-Finetti theorem for exchangeable arrays,
    and we link it to the theory of graphons. Unlike previous results, our analysis yields a canonical
    parametric model for finite exchangeable arrays. Using this characterization, we discuss the challenges
    and intrinsic difficulties of fitting exchangeable network models. <p>Joint work with Steffen
    Lauritzen and Kayvan Sadeghi.</p> <p> A previous presentation can be found <a href="http://math.iit.edu/~AlgStatSeminar/AMSfall15/slides/Ale_AMS_Oct_2015.pdf"><b>here
    </b></a>. </p> <br/>
