  title: Reach, medial axis, and their stability
  abstract: >-
    Medial axis has many applications in image analysis, shape recognition, or mathematical morphology.
    The reach is defined as distance from the set to its medial axis, and it plays key condition in
    many theorems and algorithms related to geometry reconstruction. In this talk, I will go through
    definition of medial axis and reach, several properties of medial axis and reach, and I will show
