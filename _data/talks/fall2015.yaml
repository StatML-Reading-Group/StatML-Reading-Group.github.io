- date: '2015-09-16'
  speakers:
  - eddie_aamari
  title: Simplicial Manifold Reconstruction via Tangent Space Estimation
  abstract: >-
    We look at the problem of manifold reconstruction in a semi-asymptotic framework. Under geometrical
    regularity constraints, we propose a computable estimator <em>M&#770;</em> of the support <em>M</em>
    of an unknown measure from which we observe a i.i.d. <em>n</em>-sample. <em>M</em> has the same
    topology as <em>M</em> and we give a rate of convergence for the Hausdorff distance. The method
    is based on a tangential Delaunay complex. After having reduced the question to estimating the
    tangent spaces of <em>M</em>, the problem is handled with local PCA. A denoising technique with
    local PCA in a mixture model will be presented as well. <br/> </img>
