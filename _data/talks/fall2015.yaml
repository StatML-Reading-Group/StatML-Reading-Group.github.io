- date: '2015-10-07'
  speakers:
  - jing_lei
  title: Bootstrap techniques for massive data
  abstract: >-
    I will present the paper <a href="http://arxiv.org/abs/1508.01126"><b>"A subsampled double bootstrap
    for massive data"</b></a> by Srijan Sengupta, Stanislav Volgushev and Xiaofeng Shao. The motivation
    is to make bootstrap more computationally efficient for massive data with constraints on computation
    time, communication between distributed nodes, and storage. I will also cover related works in
    a unified framework, including the more classical "m out of n" bootstrap, the double bootstrap,
    and the more recent <a href="http://arxiv.org/abs/1112.5016">"bag of little bootstrap" </a>. Although
    it would be a non-trivial achievement to just get the notation clear, I will also try to talk
    a little bit about the technical proofs if time permits. <br/>
