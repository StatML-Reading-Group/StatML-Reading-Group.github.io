  title: 'Empirical Optimal Transport: Convergence Rates and Lower Complexity Adaptation'
  abstract: >-
    The theory of optimal transport (OT) offers versatile tools for the comparison of probability
    measures in a geometrically faithful way. In statistical contexts, transport based methodology
    often relies on estimation of the optimal transport cost through an empirical plug-in approach,
    which raises questions about its accuracy. The convergence behavior of the empirical OT cost for
    increasing sample size is dictated by various aspects. These include the intrinsic dimension of
    the population measures, their concentration, as well as the regularity of the ground cost function.
    Remarkably, under distinct population measures with different intrinsic dimensions, the convergence
    rate for the empirical optimal transport cost adapts in the most favorable way, being determined
    by the lower dimensional measure. This phenomenon represents a hallmark feature of empirical optimal
    transport and is termed "lower complexity adaptation“. The talk is based on joint work with Thomas
    Staudt and Axel Munk.
  time: 4:00-5:15 pm
  room: NSH 3305
