- date: '2017-01-25'
  speakers:
  - jisu_kim
  title: Geometry of the space of phylogenetic trees and their limiting behaviors
  abstract: >-
    Phylogenetic trees, which is inferring evolutionary histories, has important applications in biology,
    criminology and public health. This talk presents a continuous space which models the set of all
    phylogenetic trees having a fixed set of leaves. This space has a natural metric of non-positive
    curvature, allowing a valid procedure for averaging or combining several trees whose leaves are
    identical. This talk also presents limiting behavior of such averaged trees. <a href="https://arxiv.org/pdf/1605.08400v1.pdf">Relevant
    paper</a>.
