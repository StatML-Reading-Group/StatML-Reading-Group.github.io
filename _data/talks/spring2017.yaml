- date: '2017-02-22'
  date_note: continued Mar 1
  speakers:
  - sangwon_hyun
  title: Exact post-selection inference with the generalized lasso
  abstract: >-
    I'll present about tools for statistical inference conditioned on model selection events that
    are defined by the generalized lasso regularization path in Tibshirani & Taylor (2011) [1], using
    recent advances in post-selection inference from Lee et al. (2016) [2], Tibshirani et al. (2016)
    [3]. These tools allow for exact hypothesis tests and confidence intervals for linear contrasts
    of the underlying mean vector, conditioned on any model selection event along the generalized
    lasso path (assuming Gaussian errors in the observations). Models covered by the generalized lasso
    included such as the fused lasso, trend filtering, and the graph fused lasso. In the fused lasso
    case, the underlying coordinates of the mean are assigned a linear ordering, and our framework
    allows us to test selectively chosen breakpoints or changepoints in these mean coordinates. This
    idea extends to changepoint models recovered by segmentation algorithms, and beyond Gaussian errors,
    and also to goodness-of-fit tests instead of targeted tests of linear contrasts as described above
    -- I'll describe these if time permits. This is work by me and my advisors Ryan Tibshirani and
    Max G'sell [4]. <ol> <li> https://arxiv.org/pdf/1005.1971.pdf <li> https://arxiv.org/pdf/1311.6238.pdf
    <li> https://arxiv.org/pdf/1401.3889.pdf <li> https://arxiv.org/pdf/1606.03552.pdf </li></li></li></li></ol>
