  title: Computationally tractable selection of experiments in regression models
  abstract: >-
    I will continue the topic that I introduced last semester on computationally efficient experiment
    selection in regression models, with additional results and analysis. I will analyze a sampling
    based method and a greedy method, both of which attain provable near-optimal statistical performance
    in polynomial time while enjoy different finite sample performance.
