- date: '2016-12-06'
  speakers:
  - dejan_slepcev
  title: Error bounds for spectral convergence of empirical graph Laplacians
  abstract: >-
    A number of machine learning tasks relies on spectral properties of the graph laplacian associated
    to the data. I will consider data points obtained as random samples of a measure on a manifold
    in $R^d$. I will discuss conditions under which the spectrum of the graph Laplacians on a neighborhood
    graph spanned by the samples converges almost surely to the spectrum of appropriate weighted Laplace-Beltrami
    operators on the manifold, as the sample size increases and the neighborhood size shrinks to zero.
    I will present error estimates for the convergence that explicitly depend on the geometry of the
    manifold, the number of data points available and the size of the neighborhood used in the graph
    construction. This is based on work that is in preparation.
