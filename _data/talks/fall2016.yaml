- date: '2016-10-25'
  speakers:
  - yiyuan_she
  title: Indirect Gaussian Graph Learning beyond Gaussianity
  abstract: >-
    This paper studies how to capture dependency graph structures from real data which may not be
    multivariate Gaussian. Starting from marginal loss functions not necessarily derived from probability
    distributions, we use an additive over-parametrization with shrinkage to incorporate variable
    dependencies into the criterion. An iterative Gaussian graph learning algorithm is proposed with
    ease in implementation. Statistical analysis shows that with the error measured in terms of a
    proper Bregman divergence, the estimators have fast rate of convergence. Real-life examples in
    different settings are given to demonstrate the efficacy of the proposed methodology.
