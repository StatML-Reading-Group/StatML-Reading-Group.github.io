- date: '2021-10-14'
  speakers:
  - yj_choe
  title: Comparing Sequential Forecasters
  abstract: >-
    We consider two or more forecasters each making a sequence of predictions over time and tackle
    the problem of how to compare them -- either online or post-hoc. In fields ranging from meteorology
    to sports, forecasters make predictions on different events or quantities over time, and this
    work describes how to compare them in a statistically rigorous manner. Specifically, we design
    a nonasymptotic sequential inference procedure for estimating the time-varying difference in forecast
    quality when using a relatively large class of scoring rules (bounded scores with a linear equivalent).
    The resulting confidence intervals can be continuously monitored and yield statistically valid
    comparisons at arbitrary data-dependent stopping times ("anytime-valid"); this is enabled by adapting
    recent variance-adaptive confidence sequences (CS) to our setting. In the spirit of Shafer and
    Vovk's game-theoretic probability, the coverage guarantees for our CSs are also distribution-free,
    in the sense that they make no distributional assumptions whatsoever on the forecasts or outcomes.
    Additionally, in contrast to a recent preprint by Henzi and Ziegel, we show how to sequentially
    test a weak null hypothesis about whether one forecaster outperforms another on average over time,
    by designing different e-processes that quantify the evidence at any stopping time. We examine
    the validity of our methods over their fixed-time and asymptotic counterparts in synthetic experiments
    and demonstrate their effectiveness in real-data settings, including comparing probability forecasts
    on Major League Baseball (MLB) games and comparing statistical postprocessing methods for ensemble
    weather forecasts. https://arxiv.org/abs/2110.00115
  room: NSH 3305
  legacy_urls:
