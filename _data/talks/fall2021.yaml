- date: '2021-10-28'
  speakers:
  - mahrad_sharifvaghefi
  title: Variable Selection and Forecasting in High Dimensional Linear Regressions with Parameter
    Instability
  abstract: >-
    This paper is concerned with the problem of variable selection and forecasting in the presence
    of parameter instability. There are a number of approaches proposed for forecasting in the presence
    of time-varying parameters, including the use of rolling windows and exponential down-weighting.
    However, these studies start with a given model specification and do not consider the problem
    of variable selection, which is complicated by time variations in the effects of signals on target
    variables. In this study we investigate whether or not we should use weighted observations at
    the vari- able selection stage in the presence of parameter instability, particularly when the
    number of potential covariates is large. Amongst the extant variable selection ap- proaches we
    focus on the recently developed One Covariate at a time Multiple Testing (OCMT) method. This procedure
    allows a natural distinction between the selection and forecasting stages. We establish three
    main theorems on selection, estimation post selection, and in-sample fit. These theorems provide
    justification for using the full (not down-weighted) sample at the selection stage of OCMT and
    down-weighting of observations only at the forecasting stage (if needed). The benefits of the
    proposed method are illustrated by empirical applications to forecasting monthly stock market
    returns and quarterly output growths. The public version of the paper is available here (https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3671261).
  room: NSH 3305
  legacy_urls:
