- date: '2019-04-30'
  speakers:
  - nihar_shah
  title: How to choose a loss function (via an axiomatic approach; for a certain problem)
  abstract: >-
    We will consider a certain problem in fairness, write it down as an ML problem, use social choice
    theory to solve it, and end with some statistical open problems. What "certain problem" you ask?
    It's a problem on making decisions in the presence of subjective opinions of multiple evaluators
    (e.g., choosing papers in conference peer review or hiring candidates in a company). What is "social
    choice theory" you ask? It is a very cool field of research on voting and decision making. Tools
    from this area can be useful for problems we study, and I'll attempt to at least briefly introduce
    this area. Do I have a draft with more details, you ask? Yes I do https://arxiv.org/pdf/1808.09057
