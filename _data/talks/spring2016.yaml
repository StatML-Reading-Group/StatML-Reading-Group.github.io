- date: '2016-04-18'
  speakers:
  - garvesh_raskutti
  title: Algorithmic and statistical perspectives of randomized sketching for ordinary least-squares
  abstract: >-
    In large-scale data settings, randomized 'sketching' has become an increasingly popular tool.
    In the numerical linear algebra literature, randomized sketching based on either random projections
    or sub-sampling has been shown to achieve optimal worst-case error. In particular the sketched
    ordinary least-squares (OLS) solution and the CUR decomposition have been shown to achieve optimal
    approximation error bounds in a worst-case setting. However, until recently there has been limited
    work on consider the performance of the OLS estimator under a statistical model using statistical
    metrics. In this talk I present some recent results which address both the performance of sketching
    in the statistical setting, where we assume an underlying statistical model and show that many
    of the existing intuitions and results are quite different from the worst-case algorithmic setting.
    <br/><br/> This is based on joint work with Michael Mahoney. Reference: <a href="https://arxiv.org/abs/1505.06659">https://arxiv.org/abs/1505.06659</a>.
  time: 1:30 pm
