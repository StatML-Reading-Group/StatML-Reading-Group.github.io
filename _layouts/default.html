<!-- Chrome adapted from ericchen28.github.io. Load order matters: the theme
     script must run BEFORE any stylesheet or the page flashes light-then-dark. -->
<meta charset="utf-8">
<title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo title=false %}

<!-- Theme (must run before first paint; keep before all CSS links) -->
<meta name="theme-color" id="meta-theme-color" content="#ffffff">
<script>
  (function () {
    var t = null;
    try { t = new URLSearchParams(window.location.search).get('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('theme'); } catch (e) {} }
    if (t !== 'light' && t !== 'dark') { t = 'light'; }  // default: day
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('meta-theme-color');
    if (m) m.setAttribute('content', t === 'dark' ? '#14161a' : '#ffffff');
  })();
</script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/libs/external/skeleton/normalize.css' | relative_url }}">

<link rel="icon" type="image/png" href="{{ '/libs/icon.png' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<button class="theme-toggle theme-toggle-floating" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
  <i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i>
</button>

</div>
