# Corrections and additions applied on top of the migrated people.csv data.
#
# people.csv was last maintained in Dec 2025 and has drifted badly -- Simon Du
# was still recorded as a Princeton postdoc six years after he became UW
# faculty. Keeping corrections here rather than hand-editing _data/people.yaml
# means re-running merge.py cannot silently revert them.
#
# Anything set here wins; `null` removes a field.
#
# Every entry below was verified against a primary source (the person's own
# homepage, a department directory, or a CV) in August 2026. Where a claim
# could not be confirmed, the field is left alone rather than guessed -- for a
# page naming real people, blank beats wrong.

